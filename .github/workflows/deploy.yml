name: Research, narrate, and deploy Stack Wire

on:
  # Research now happens outside GitHub entirely — a scheduled Claude Code
  # routine ("Stack Wire daily research", ~5am Pacific) writes and pushes
  # content/<date>.json directly using the user's own Claude plan instead of
  # a metered ANTHROPIC_API_KEY. That push is what fires this workflow.
  workflow_dispatch: {} # lets you trigger a full run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "content/**.json" # today's edition landing (from the Claude routine, or a hand edit)
      - "scripts/**"

permissions:
  contents: write # needed so this workflow can commit today's generated narration back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Narration is opt-in, not automatic — it costs OpenAI credits, so it
      # no longer runs on every content push. To generate audio for a day,
      # trigger this workflow manually from the Actions tab ("Run workflow");
      # these three steps only run on that event type. To go back to
      # narrating every day automatically, just delete the two `if:` lines
      # below (the steps themselves are untouched).

      # ffmpeg isn't reliably preinstalled on GitHub-hosted runners, so
      # install it explicitly — scripts/generate-audio.mjs uses it to stitch
      # multi-chunk narration into one seamless mp3.
      - name: Install ffmpeg
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Narrate today's edition
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run narrate

      - name: Commit today's narration
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Stack Wire Bot"
          git config user.email "stack-wire-bot@users.noreply.github.com"
          git add audio/*.mp3
          git diff --cached --quiet && echo "No audio changes to commit" || git commit -m "Narrate $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
