name: Research, narrate, and deploy Stack Wire

on:
  schedule:
    - cron: "7 12 * * *" # 12:07 UTC daily (~5am Pacific) — off-the-hour minute,
      # timed to catch the prior day's full US market close/after-hours news
      # while still leaving some buffer before a 7am read. GitHub queues and
      # can delay scheduled runs, especially ones set for the exact top of
      # the hour — adjust the hour/minute to taste, just avoid ":00".
  workflow_dispatch: {} # lets you trigger a full run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - "content/**.json" # a manually-edited/added content file still narrates + deploys
      - "scripts/**"

permissions:
  contents: write # needed so this workflow can commit today's generated content back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only research + write new content on a scheduled/manual run — a push
      # (e.g. you hand-edited a content file) already has its content ready.
      - name: Research and write today's edition
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-content.mjs

      - name: Commit today's content
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "Stack Wire Bot"
          git config user.email "stack-wire-bot@users.noreply.github.com"
          git add content/*.json
          git diff --cached --quiet && echo "No content changes to commit" || git commit -m "Stack Wire — $(date -u +%Y-%m-%d)"
          git push origin HEAD:main

      # ffmpeg isn't reliably preinstalled on GitHub-hosted runners, so
      # install it explicitly — scripts/generate-audio.mjs uses it to stitch
      # multi-chunk narration into one seamless mp3.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Narrate today's edition
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run narrate

      - name: Commit today's narration
        run: |
          git config user.name "Stack Wire Bot"
          git config user.email "stack-wire-bot@users.noreply.github.com"
          git add audio/*.mp3
          git diff --cached --quiet && echo "No audio changes to commit" || git commit -m "Narrate $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build site
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
